<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AidFlow – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-left">
      <span class="logo">AidFlow</span>
      <a class="nav-link" href="#">Dashboard</a>
    </div>
    <div class="nav-right">
      <!-- Bell -->
      <div class="nav-icon" title="Notifications">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </div>
      <!-- Gear -->
      <div class="nav-icon" title="Settings">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </div>
      <!-- Avatar -->
      <div class="avatar">KM</div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="card">
      <h1 class="card-title">Add New Distribution Point</h1>
      <p class="card-sub">Register a new humanitarian aid station within the active network.</p>

      <!-- Point Name -->
      <div class="field">
        <label for="pointName">Point Name</label>
        <input type="text" id="pointName" placeholder="e.g., Central Station A" />
      </div>

      <!-- Type -->
      <div class="field">
        <label for="type">Type</label>
        <div class="select-wrap">
          <select id="type">
            <option>Food</option>
            <option>Medical</option>
            <option>Shelter</option>
            <option>Water</option>
            <option>Clothing</option>
          </select>
          <span class="chevron">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </div>
      </div>

      <!-- Area -->
      <div class="field">
        <label for="area">Area</label>
        <div class="select-icon-wrap">
          <span class="pin-left">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          </span>
          <select id="area">
            <option>Rafah</option>
            <option>Gaza City</option>
            <option>Khan Yunis</option>
            <option>Deir al-Balah</option>
            <option>Jabalia</option>
          </select>
          <span class="chevron">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </div>
      </div>

      <!-- Organization -->
      <div class="field">
        <label for="organization">Organization</label>
        <div class="select-wrap">
          <select id="organization">
            <option>Organization 1</option>
            <option>Organization 2</option>
            <option>Organization 3</option>
            <option>UNRWA</option>
            <option>WFP</option>
          </select>
          <span class="chevron">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </div>
      </div>

      <!-- Address -->
      <div class="field">
        <label for="address">Address</label>
        <div class="input-icon-wrap">
          <span class="icon-left">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </span>
          <input type="text" id="address" placeholder="e.g., Main Street, Rafah" />
        </div>
      </div>

      <!-- Status -->
      <div class="field">
        <label for="status">Status</label>
        <div class="select-wrap">
          <select id="status">
            <option>Available</option>
            <option>Unavailable</option>
          </select>
          <span class="chevron">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </span>
        </div>
      </div>

      <!-- Submit Button -->
      <button class="btn-add" type="button">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        Add Point
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div>
      <div class="footer-brand">AidFlow Humanitarian Systems</div>
      <div class="footer-copy">© 2024 AidFlow Humanitarian Systems</div>
    </div>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">Help Center</a>
    </div>
  </footer>

  <script src="index.js"></script>

</body>

</html>
